version: '3.8'

services:
  analyzer:
    build: .
    profiles: ["analyze"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./reports:/app/reports
      - ./config.yaml:/app/config.yaml
    command: >
      python -m app --log-file /app/logs/sample_auth.log --format linux
    depends_on:
      - dashboard

  dashboard:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    command: python -m app --mode dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  log-generator:
    build: .
    profiles: ["generate"]
    volumes:
      - ./logs:/app/logs
    command: python scripts/generate_logs.py